<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06131b"><title>OHMU | 腐海互動首頁 v0.1.2</title><link rel="stylesheet" href="style.css?v=012"></head><body>
<div id="stage" aria-label="王蟲腐海互動首頁" tabindex="0">
 <img id="scene" src="assets/ohmu-cave.png" alt="腐海洞穴中的巨大王蟲">
 <div class="shade"></div><canvas id="atmosphere" width="1672" height="941" aria-hidden="true"></canvas>
 <div id="eyes" aria-hidden="true"></div><div id="veil"></div>
 <div id="top"><span class="brand">風之谷 <small>OHMU / 腐海</small></span><button id="settings" aria-label="開啟設定">⚙</button></div>
 <div id="dock" role="toolbar" aria-label="應用程式選單"></div>
 <div id="toast" role="status" aria-live="polite"></div>
 <div id="panel" hidden><div class="panel-body"><h2>王蟲互動設定</h2><label>眼睛亮度 <output id="glowOut">95%</output><input id="glow" type="range" min="0" max="100" value="95"></label><label>霧氣強度 <output id="fogOut">35%</output><input id="fog" type="range" min="0" max="100" value="35"></label><label>沉浸模式 <select id="idle"><option value="30">30 秒</option><option value="60" selected>60 秒</option><option value="120">120 秒</option><option value="0">關閉</option></select></label><label class="check"><input id="calibrate" type="checkbox"> 調整眼睛位置（拖動光點）</label><button id="reset">重設眼睛位置</button><button id="close">完成</button><p>左右方向鍵切換 App，Enter 啟動動畫，Esc 返回。手機點選 App；向左右滑動也能切換。</p></div></div>
</div><div id="outside">請將手機橫向旋轉，獲得最佳 16:9 畫面。</div><script src="app.js?v=012"></script></body></html>
